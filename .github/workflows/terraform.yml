name: Terraform Actions

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Selecciona el ambiente de despliegue"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prd
      accion:
        description: "Acción de Terraform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - plan+apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Copiar backend y tfvars del ambiente
        run: |
          cp envs/${{ github.event.inputs.ambiente }}/backend.tf ./backend.tf
          cp envs/${{ github.event.inputs.ambiente }}/terraform.tfvars ./terraform.tfvars

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init
        run: terraform init
        env:
          ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Ejecutar Terraform
        run: |
          case "${{ github.event.inputs.accion }}" in
            "plan")
              terraform plan
              ;;
            "plan+apply")
              terraform apply -auto-approve
              ;;
            "destroy")
              terraform destroy -auto-approve
              ;;
          esac
        env:
          ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
